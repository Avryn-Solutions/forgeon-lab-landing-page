<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Paleta roxa ForgeonLab</title>
  <desc id="desc">Gradiente oficial de roxo #7B4DFF para lilás #9F7BFF e quatro tons de apoio.</desc>
  <defs><linearGradient id="forgeon" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#7B4DFF"/><stop offset="1" stop-color="#9F7BFF"/></linearGradient></defs>
  <rect width="900" height="520" fill="#FFFFFF"/>
  <text x="36" y="58" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#211B30">ForgeonLab</text>
  <text x="36" y="86" font-family="Arial,sans-serif" font-size="16" fill="#5530AD">IDENTIDADE VISUAL / CORES</text>
  <rect x="36" y="115" width="828" height="155" rx="8" fill="url(#forgeon)"/>
  <text x="55" y="235" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#211B30">#7B4DFF → #9F7BFF</text>
  <rect x="36" y="306" width="191" height="125" rx="6" fill="#5530AD"/>
  <rect x="248" y="306" width="191" height="125" rx="6" fill="#B48CFF"/>
  <rect x="460" y="306" width="191" height="125" rx="6" fill="#F6F4FB" stroke="#E4DEEA"/>
  <rect x="672" y="306" width="191" height="125" rx="6" fill="#211B30"/>
  <g font-family="Arial,sans-serif" font-size="15" fill="#211B30">
    <text x="36" y="458">Roxo escuro</text><text x="36" y="483">#5530AD</text>
    <text x="248" y="458">Lilás suave</text><text x="248" y="483">#B48CFF</text>
    <text x="460" y="458">Lilás quase branco</text><text x="460" y="483">#F6F4FB</text>
    <text x="672" y="458">Tinta</text><text x="672" y="483">#211B30</text>
  </g>
</svg>
